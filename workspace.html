    <script>
      // Install the offline boundary before the IIFE evaluates any legacy imports.
      window.__sagbStartWorkspace = function (src) {
        const target = location.origin;
        const notify = (reason) => { if (parent !== window) parent.postMessage({type:'sagb:workspace-error',reason},target); };
        if (parent === window || window.origin !== 'null' || location.pathname !== '/workspace.html') {
          document.getElementById('root').textContent = 'Abra o SagB pelo acesso autenticado.';
          return;
        }
        try {
          for (const name of ['localStorage','sessionStorage']) {
            const map = new Map();
            const storage = {get length(){return map.size},clear(){map.clear()},getItem(k){return map.get(String(k))??null},key(i){return [...map.keys()][i]??null},removeItem(k){map.delete(String(k))},setItem(k,v){map.set(String(k),String(v))}};
            Object.defineProperty(window,name,{configurable:true,get:()=>storage});
            if(window[name]!==storage)throw new Error('Storage isolation');
          }
          window.fetch = async () => { throw new Error('Workspace offline'); };
          window.__sagbOfflinePrepared = true;
          window.addEventListener('error',e=>{ if(e.target instanceof HTMLScriptElement || e.error)notify('script'); });
          window.addEventListener('unhandledrejection',()=>notify('runtime'));
          const script = document.createElement('script');
          script.src=src; script.async=false;
          script.onerror=()=>notify('asset');
          document.body.appendChild(script);
        } catch { notify('isolation'); document.getElementById('root').textContent='Não foi possível iniciar o ambiente isolado.'; }
      };
    </script>

  <script>
    // Script de diagnóstico para verificar carregamento do Tailwind
    window.addEventListener('load', function() {
      console.log('Página carregada - verificando Tailwind...');
      
      // Verifica se o Tailwind está carregado
      setTimeout(function() {
        const testElement = document.createElement('div');
        testElement.className = 'hidden';
        document.body.appendChild(testElement);
        
        const computedStyle = window.getComputedStyle(testElement);
        const displayValue = computedStyle.display;
        
        console.log('Teste Tailwind:', {
          displayValue: displayValue,
          tailwindLoaded: displayValue === 'none',
          bodyClasses: document.body.className,
          rootElement: document.getElementById('root') ? 'present' : 'missing'
        });
        
        document.body.removeChild(testElement);
        
        // Verifica se há erros no console
        if (typeof tailwind === 'undefined') {
          console.error('Tailwind não carregado via CDN!');
          // Aplica estilos de fallback
          document.body.classList.add('auth-fallback');
        } else {
          console.log('Tailwind carregado com sucesso');
        }
      }, 1000);
    });
  </script>
