# Netlify configuration for SagB

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  targetPort = 7013
  autoLaunch = false

[build.environment]
  NODE_VERSION = "20"
  # Supabase Auth: configure VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY
  # por contexto (production / deploy-preview) nas variáveis de build do Netlify.
  # Não fixe aqui URL nem chave: netlify.toml teria precedência sobre o painel.

# ─── API SagB — Variáveis de Ambiente ──────────────────────────────

[functions."api-sagb-router"]
  environment = { SUPABASE_URL = "https://sagb.supabase.co", SUPABASE_SERVICE_KEY = "@@SUPABASE_SERVICE_KEY@@", TASKZEI_API_URL = "https://taskzei.sagb.com.br/api", CRM_API_URL = "https://crm.ziplia.com.br/api", STUDIO_API_URL = "https://studio.sagb.com.br/api", VOX_API_URL = "https://vox.sagb.com.br/api", RATE_LIMIT_CAPACITY = "100", RATE_LIMIT_REFILL = "10" }

[functions."api-sagb-audit"]
  environment = { SUPABASE_URL = "https://sagb.supabase.co", SUPABASE_SERVICE_KEY = "@@SUPABASE_SERVICE_KEY@@" }

# ─── Hub de Integrações — Webhook WhatsApp ────────────────────────

[functions."whatsapp-webhook"]
  environment = { SUPABASE_URL = "https://sagb.supabase.co", SUPABASE_SERVICE_KEY = "@@SUPABASE_SERVICE_KEY@@", MOCK_META_VERIFY_TOKEN = "@@MOCK_META_VERIFY_TOKEN@@" }

# ─── Hub de Integrações — WhatsApp QR (Baileys) ───────────────────

[functions."whatsapp-qr"]
  environment = { SUPABASE_URL = "https://sagb.supabase.co", SUPABASE_SERVICE_KEY = "@@SUPABASE_SERVICE_KEY@@", HUB_WHATSAPP_QR_API_KEY = "@@HUB_WHATSAPP_QR_API_KEY@@" }

# Headers de segurança e performance

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Tratamento de 404 e SPA (React Router)

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

# ─── API SagB — Redirects para Funções Serverless ─────────────────

[[redirects]]
  from = "/api-sagb/*"
  to = "/.netlify/functions/api-sagb-router"
  status = 200
  force = true

[[redirects]]
  from = "/api-sagb-audit/*"
  to = "/.netlify/functions/api-sagb-audit"
  status = 200
  force = true

[[redirects]]
  from = "/hub/whatsapp-qr/*"
  to = "/.netlify/functions/whatsapp-qr"
  status = 200
  force = true

[[redirects]]
  from = "/hub/email-titan/*"
  to = "/.netlify/functions/email-titan-driver"
  status = 200
  force = true

[[redirects]]
  from = "/hub/email-sync/*"
  to = "/.netlify/functions/email-sync-background"
  status = 200
  force = true

[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
